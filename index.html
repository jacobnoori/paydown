<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Debt Tracker</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3" fill="currentColor" opacity=".18"/><path d="M2 9h20M6 15h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Debt Tracker</span>
      </div>
      <nav>
        <a href="#/dashboard" data-nav="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>Dashboard</a>
        <a href="#/accounts" data-nav="accounts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Accounts</a>
        <a href="#/calendar" data-nav="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
      </nav>
      <div class="sidebar-foot">
        <div id="syncStatus" class="sync">…</div>
        <button class="btn ghost sm" data-action="theme" id="themeBtn">Theme: System</button>
        <div class="row">
          <button class="btn ghost sm" data-action="export">Export</button>
          <button class="btn ghost sm" data-action="import">Import</button>
        </div>
        <div class="row">
          <button class="btn ghost sm" data-action="password">Password</button>
          <button class="btn ghost sm" data-action="logout">Sign out</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
