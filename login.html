<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Sign in · Paydown</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { --bg:#f5f6fa; --surface:#fff; --border:#e3e6ee; --text:#151826; --muted:#646b80; --accent:#4f46e5; --danger:#dc2626; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e1016; --surface:#161922; --border:#2a2f3c; --text:#e9ebf2; --muted:#9399ab; --accent:#8b85ff; --danger:#f87171; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px;
      box-shadow: 0 4px 24px rgba(16,24,40,.08); display: flex; flex-direction: column; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .brand img { width: 30px; height: 30px; }
    p { margin: 0; color: var(--muted); }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
    input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 10px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: var(--danger); font-weight: 550; min-height: 1.5em; }
  </style>
</head>
<body>
  <form id="f">
    <div class="brand"><img src="icon.svg" alt="">Paydown</div>
    <p>Sign in to continue.</p>
    <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <div class="error" id="err" role="alert"></div>
    <button id="btn">Sign in</button>
  </form>
  <script>
    const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
    f.addEventListener('submit', async e => {
      e.preventDefault(); err.textContent = ''; btn.disabled = true;
      try {
        const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: f.password.value }) });
        if (r.ok) { location.replace('./'); return; }
        err.textContent = (await r.json().catch(() => ({}))).error || 'Sign in failed';
        f.password.select();
      } catch { err.textContent = 'Cannot reach the server'; }
      btn.disabled = false;
    });
  </script>
</body>
</html>
